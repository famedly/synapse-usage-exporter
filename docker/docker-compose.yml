version: '3'

services:

  server:
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        - APP_VERSION=${DOCKER_IMAGE_TAG:-latest}
        - BUILD_ID=${BUILD_ID:-undefined}
    image: synapse-usage-exporter:${DOCKER_IMAGE_TAG:-latest}
    ports:
      - 5000:5000
    tmpfs:
      # The container runs as an unprivileged user, so the tmpfs must be writable
      # by it; without a mode the kernel mounts it root-owned 0755.
      - /tmp/prometheus:mode=1777
    environment:
      - APP_LOG_LEVEL=DEBUG
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
